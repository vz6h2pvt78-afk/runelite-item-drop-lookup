plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.itemdroplookup.ItemDropLookupPluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.itemdroplookup'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}

// Renders the sidebar alone for layout review; no game client or login required.
tasks.register('previewSidebar', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.itemdroplookup.ui.SidebarPreview'
	workingDir = projectDir
	jvmArgs '-Djava.awt.headless=true'
}

// Offline data/UI diagnostics; pass -PauditItems=... -PauditOutput=...
tasks.register('auditSidebar', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.itemdroplookup.ui.HighVolumeAudit'
	jvmArgs '-Djava.awt.headless=true'
	if (project.hasProperty('auditItems') && project.hasProperty('auditOutput')) {
		args project.property('auditItems'), project.property('auditOutput')
	}
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// C1 review tools use test classes/resources and are excluded from the production JAR.
tasks.register('previewDesignConcepts', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.itemdroplookup.ui.DesignConceptPreview'
	jvmArgs '-Djava.awt.headless=true'
	if (project.hasProperty('previewOutput')) args project.property('previewOutput')
}

tasks.register('runDesignConcepts', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.itemdroplookup.ui.DesignConceptPlugin'
	jvmArgs '-ea'
	args '--developer-mode'
}
